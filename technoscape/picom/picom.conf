# Technoscape — picom compositor
# soft neon glow without killing performance

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = #0a0e14;

# i3-managed windows get shadows; bars/notifications do not
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

blur-background = true;
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# subtle neon edges on focused windows
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
