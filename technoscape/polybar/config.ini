; Technoscape — Polybar

[colors]
bg       = #cc0a0e14
surface  = #cc11151f
fg       = #a9b1d6
dim      = #565f89
cyan     = #00e5ff
magenta  = #ff2a6d
green    = #05ffa1
purple   = #b967ff

[bar/technoscape]
width = 100%
height = 32
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = "JetBrainsMono Nerd Font:weight=regular:pixelsize=11;2"
font-1 = "JetBrainsMono Nerd Font:weight=bold:pixelsize=11;2"
modules-left = i3 sep cpu memory
modules-right = filesystem pulseaudio network date
separator = |
module-margin = 2
padding = 2
line-size = 2
line-color = ${colors.cyan}
enable-scroll = false
wm-restack = i3
override-redirect = false

[module/sep]
type = custom/text
content = " "
content-foreground = ${colors.dim}

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-background = ${colors.magenta}
label-focused = %name%
label-focused-foreground = ${colors.cyan}
label-focused-underline = ${colors.cyan}
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-visible = %name%
label-visible-underline = ${colors.dim}
label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.magenta}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label =  %percentage:2%%
format-underline = ${colors.purple}

[module/memory]
type = internal/memory
interval = 2
format = <label>
label =  %percentage_used%%
format-underline = ${colors.green}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format = <label>
label =  %free%
format-underline = ${colors.dim}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.fg}
format-muted = <label-muted>
label-muted =  muted
label-muted-foreground = ${colors.dim}
format-volume-underline = ${colors.cyan}

[module/network]
type = internal/network
interval = 3
format-connected = <label-connected>
label-connected = %ifname% %local_ip%
format-disconnected = <label-disconnected>
label-disconnected =  offline
label-disconnected-foreground = ${colors.magenta}
format-connected-underline = ${colors.cyan}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format = <label>
label =  %date%
format-underline = ${colors.magenta}

[settings]
screenchange-reload = true
pseudo-transparency = true
